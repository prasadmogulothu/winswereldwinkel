<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Groenten — money &amp; weight test</title>
<style>
  body { font: 15px/1.6 ui-monospace, Consolas, monospace; background:#14181C; color:#F2F4F0;
         margin:0; padding:32px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:#99A1A9; margin:0 0 24px; }
  .row { padding:5px 0; border-bottom:1px solid #2C343B; }
  .pass::before { content:'PASS  '; color:#7FB800; }
  .fail::before { content:'FAIL  '; color:#E04343; }
  .fail { color:#E04343; }
  #sum { margin-top:24px; padding:14px 18px; border-radius:10px; font-weight:700; font-size:17px; }
  .green { background:#1E2A08; color:#9BD11A; border:1px solid #7FB800; }
  .red   { background:#2A1010; color:#FF7A7A; border:1px solid #E04343; }
</style>
</head>
<body>
<h1>Money and weight test</h1>
<p class="sub">Everything must be green before this is used at the counter.</p>
<div id="out"></div>
<div id="sum"></div>

<script type="module">
import {
  snapWeight, checkWeight, lineTotal, basketTotal,
  formatEuro, formatQty, parseNumber,
  SCALE_STEP_KG, SCALE_MIN_KG, SCALE_MAX_KG
} from './js/money.js';

let pass = 0, fail = 0;
const out = document.getElementById('out');

function is(actual, expected, label) {
  const ok = Object.is(actual, expected);
  ok ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = 'row ' + (ok ? 'pass' : 'fail');
  d.textContent = ok ? label : `${label}  —  got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`;
  out.appendChild(d);
}

const kg   = { unit: 'kg',   price: 380 };  // Tomaat, EUR 3,80 / kg
const stuk = { unit: 'stuk', price: 110 };  // Komkommer, EUR 1,10 each
const bos  = { unit: 'bos',  price: 150 };  // Koriander, EUR 1,50 a bunch

// --- the case straight off his Hanka receipt ---------------------------
is(lineTotal(kg, 2.615), 994, '2,615 kg x 3,80 = 9,94   (the receipt line from his till)');
is(formatEuro(lineTotal(kg, 2.615)), '9,94', 'and that reads as "9,94"');

// --- rounding, where float maths would betray us -----------------------
is(lineTotal({ unit:'kg', price: 100 }, 0.005), 1, '5 g x 1,00 = 0,01 (rounds up, not to 0)');
is(lineTotal({ unit:'kg', price: 199 }, 1.005), 200, '1,005 kg x 1,99 = 2,00 (half-up, not 1,99)');
is(lineTotal({ unit:'kg', price: 333 }, 3.335), 1111, '3,335 kg x 3,33 = 11,11');
is(lineTotal(kg, 0.1), 38, '100 g x 3,80 = 0,38');

// A weight the DIGI cannot show is snapped BEFORE it is priced, so the amount
// always matches a weight that was really on the display.
is(lineTotal({ unit:'kg', price: 333 }, 3.333), 1111,
   '3,333 kg snaps to 3,335 first (the scale steps in 5 g), so 11,11 - not 11,10');

// --- counted items get no decimals -------------------------------------
is(lineTotal(stuk, 3), 330, '3 cucumbers x 1,10 = 3,30');
is(lineTotal(bos, 2), 300, '2 bunches of coriander x 1,50 = 3,00');
is(lineTotal(stuk, 2.7), 330, '2,7 cucumbers counts as 3 - you do not sell half a cucumber');

// --- the scale can only show multiples of 5 g --------------------------
is(snapWeight(2.617), 2.615, 'snapWeight(2.617) = 2.615');
is(snapWeight(2.618), 2.620, 'snapWeight(2.618) = 2.620');
is(snapWeight(1.0), 1.0, 'snapWeight(1.000) stays 1.000');
is(SCALE_STEP_KG, 0.005, 'DIGI step = 5 g');

// --- limits of the actual scale on his counter -------------------------
is(checkWeight(2.615).level, 'ok', '2,615 kg is simply fine');
is(checkWeight(0.05).level, 'warn', '50 g warns - below the scale minimum');
is(checkWeight(0.05).ok, true, '...but is still accepted');
// Messages are keys, not sentences: money.js knows no language and no DOM.
is(checkWeight(0.05).key, 'scale.tooLight', '50 g returns the key scale.tooLight');
is(checkWeight(20).key, 'scale.tooHeavy', '20 kg returns the key scale.tooHeavy');
is(checkWeight(2.615).key, '', 'a valid weight returns no message');
is(checkWeight(15.001).ok, false, '15,001 kg is rejected - the scale goes to 15 kg');
is(checkWeight(15.0).ok, true, '15,000 kg is just allowed');
is(checkWeight(0).ok, false, '0 kg is rejected');
is(checkWeight(-1).ok, false, 'a negative weight is rejected');
is(checkWeight('abc').ok, false, 'nonsense is rejected');
is(SCALE_MIN_KG, 0.1, 'DIGI minimum = 100 g');
is(SCALE_MAX_KG, 15, 'DIGI maximum = 15 kg');

// --- basket -------------------------------------------------------------
is(basketTotal([{ cents: 994 }, { cents: 405 }]), 1399, 'basket: 9,94 + 4,05 = 13,99');
is(basketTotal([]), 0, 'empty basket = 0,00');
is(formatEuro(basketTotal([{ cents: 994 }, { cents: 405 }])), '13,99', 'and that reads as "13,99"');

// --- formatting ---------------------------------------------------------
is(formatEuro(0), '0,00', 'formatEuro(0) = "0,00"');
is(formatEuro(5), '0,05', 'formatEuro(5) = "0,05" - the leading zero stays');
is(formatEuro(100), '1,00', 'formatEuro(100) = "1,00"');
is(formatEuro(123456), '1234,56', 'formatEuro(123456) = "1234,56"');
is(formatQty(kg, 2.615), '2,615', 'weight shows three decimals');
is(formatQty(stuk, 3), '3', 'pieces show no decimals');

// --- typing ------------------------------------------------------------
is(parseNumber('2,615'), 2.615, 'typing a comma works');
is(parseNumber('2.615'), 2.615, 'typing a full stop works too');
is(parseNumber(' 2,615 '), 2.615, 'surrounding spaces do not matter');
is(Number.isNaN(parseNumber('')), true, 'an empty field is not a number - otherwise a blank price would become 0,00');
is(Number.isNaN(parseNumber('   ')), true, 'whitespace only is not a number either');
is(Number.isNaN(parseNumber(null)), true, 'null is not a number');
is(parseNumber('0'), 0, 'but a typed 0 really is zero');

const sum = document.getElementById('sum');
sum.className = fail === 0 ? 'green' : 'red';
sum.textContent = fail === 0
  ? `All good — ${pass} checks passed.`
  : `${fail} of ${pass + fail} checks FAILED. Do not use at the counter.`;
</script>
</body>
</html>
